[package]
name = "ledger-mcp"
description = "Stdio MCP server that exposes the Freehold Ledger operations as tools"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "ledger-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ledger-core = { path = "../ledger-core" }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
chrono = "0.4"

[dev-dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3"
