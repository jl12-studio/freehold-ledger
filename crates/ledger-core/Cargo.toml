[package]
name = "ledger-core"
description = "Pure library that owns the Freehold Ledger SQLite file"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "ledger_core"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dirs = "7.0.0"
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
